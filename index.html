<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Japón · Octubre 2026</title>
<style>
  :root{
    color-scheme: light;
    --ink:#15253C;
    --ink-2:#4B5A70;
    --paper:#E9E6DC;
    --card:#FBF9F4;
    --line:#CFC9B9;
    --shu:#B23A20;
    --sea:#2F6E79;
    --ok:#3C6B45;
    --radius:3px;
    --max:760px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{-webkit-text-size-adjust:100%; scroll-padding-top:calc(54px + env(safe-area-inset-top,0px))}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:16px;
    line-height:1.5;
    font-variant-numeric:tabular-nums;
  }
  h1,h2,h3{font-family:Georgia,"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:400;margin:0}
  a{color:var(--sea)}

  .wrap{max-width:var(--max);margin:0 auto;padding:0 18px}

  /* ---------- Portada: la ruta ---------- */
  header{background:var(--ink);color:#F1EEE6;padding:26px 0 0}
  header h1{font-size:30px;letter-spacing:.06em;color:#fff}
  header .fechas{font-size:14px;color:#A9B6C9;margin-top:4px}
  .ruta{display:flex;gap:0;overflow-x:auto;margin-top:22px;padding:0 18px 20px;
        max-width:var(--max);margin-left:auto;margin-right:auto;
        scrollbar-width:none}
  .ruta::-webkit-scrollbar{display:none}
  .parada{flex:0 0 auto;min-width:78px;position:relative;padding-top:20px;text-align:center}
  .parada::before{content:"";position:absolute;top:5px;left:0;right:0;height:1px;background:#4E607A}
  .parada:first-child::before{left:50%}
  .parada:last-child::before{right:50%}
  .parada .punto{position:absolute;top:1px;left:50%;transform:translateX(-50%);
                 width:9px;height:9px;border-radius:50%;background:#A9B6C9}
  .parada.base .punto{background:#fff;width:11px;height:11px;top:0}
  .parada .nom{display:block;font-size:12.5px;color:#DCE3EC;line-height:1.25}
  .parada .noches{display:block;font-size:11px;color:#8B9BB2;margin-top:2px}

  /* ---------- Navegación ---------- */
  nav{position:sticky;top:0;z-index:20;background:var(--paper);
      border-bottom:1px solid var(--line);
      padding-top:env(safe-area-inset-top,0px)}
  .tabs{display:flex;gap:2px;overflow-x:auto;max-width:var(--max);margin:0 auto;
        padding:0 12px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;
    font:inherit;font-size:14px;color:var(--ink-2);padding:14px 10px;cursor:pointer}
  .tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--shu)}
  .tabs button:focus-visible{outline:2px solid var(--sea);outline-offset:-2px}

  main{padding:22px 0 70px}
  section[hidden]{display:none}
  h2.titulo{font-size:22px;margin-bottom:4px}
  .sub{font-size:13.5px;color:var(--ink-2);margin-bottom:18px}

  /* ---------- Avisos ---------- */
  .aviso{background:var(--card);border-left:3px solid var(--shu);
    padding:13px 15px;margin-bottom:14px;border-radius:0 var(--radius) var(--radius) 0}
  .aviso.info{border-left-color:var(--sea)}
  .aviso h3{font-size:15px;margin-bottom:3px}
  .aviso p{margin:0;font-size:14px;color:var(--ink-2)}

  /* ---------- Tarjetas ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:10px}
  .fila{display:flex;gap:14px;align-items:baseline;justify-content:space-between}
  .card h3{font-size:16.5px;line-height:1.3}
  .meta{font-size:13px;color:var(--ink-2);margin-top:3px}
  .precio{font-size:13px;color:var(--ink-2);white-space:nowrap}
  .tag{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:2px;
    border:1px solid currentColor;margin-top:8px}
  .tag.ok{color:var(--ok)}
  .tag.alerta{color:var(--shu)}
  .card.choque{border-color:var(--shu);border-left-width:3px}

  /* ---------- Itinerario ---------- */
  .dia{display:grid;grid-template-columns:52px 1fr;gap:14px;
    padding:15px 0;border-bottom:1px solid var(--line)}
  .dia:last-child{border-bottom:0}
  .dia .fecha{text-align:center;line-height:1.15;padding-top:2px}
  .dia .num{display:block;font-family:Georgia,serif;font-size:23px}
  .dia .dow{display:block;font-size:11px;color:var(--ink-2)}
  .dia .plan{font-size:15.5px}
  .dia .donde{font-size:13px;color:var(--sea);margin-top:3px}
  .dia .como{font-size:13px;color:var(--ink-2);margin-top:5px}
  .dia.hoy{background:var(--card);margin:0 -14px;padding-left:14px;padding-right:14px;
    border-left:3px solid var(--shu)}

  /* ---------- Listas de acciones ---------- */
  .check{display:flex;gap:11px;align-items:flex-start;padding:11px 0;
    border-bottom:1px solid var(--line);font-size:14.5px}
  .check:last-child{border-bottom:0}
  .check input{margin-top:3px;width:17px;height:17px;accent-color:var(--sea);flex:0 0 auto}
  .check .cuando{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
  .check.listo label{text-decoration:line-through;color:var(--ink-2)}

  .links a{display:block;padding:9px 0;font-size:14.5px;border-bottom:1px solid var(--line)}
  .links a:last-child{border-bottom:0}

  .vacio{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
    padding:26px 18px;text-align:center;color:var(--ink-2);font-size:14.5px}

  /* ---------- Documentos de cada tarjeta ---------- */
  .card.abre{cursor:pointer}
  .card.abre:focus-visible{outline:2px solid var(--sea);outline-offset:1px}
  .card .docs-hint{font-size:13px;color:var(--sea);margin:9px 0 0}
  dialog.hoja{width:min(100%,var(--max));max-width:100%;max-height:88vh;margin:auto auto 0;
    border:0;border-radius:8px 8px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));
    background:var(--card);color:var(--ink);overflow-y:auto}
  dialog.hoja::backdrop{background:rgba(21,37,60,.45)}
  .hoja .cerrar{float:right;background:none;border:0;font:inherit;font-size:14px;color:var(--sea);
    padding:4px 0 8px 12px;cursor:pointer}
  .hoja h4{font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    color:var(--ink-2);margin:20px 0 6px}
  .capturas{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .captura{position:relative}
  .captura button.ver{display:block;width:100%;padding:0;border:1px solid var(--line);
    border-radius:var(--radius);background:var(--paper);cursor:pointer;aspect-ratio:3/4;overflow:hidden}
  .captura img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
  .captura button.borrar{margin-top:3px;background:none;border:0;font:inherit;font-size:12px;
    color:var(--shu);padding:2px 0;cursor:pointer}
  .agregar{display:inline-block;margin-top:12px;padding:10px 14px;border:1px solid var(--sea);
    border-radius:var(--radius);color:var(--sea);font-size:14.5px;cursor:pointer}
  .agregar input{display:none}
  .hoja .nota{font-size:12.5px;color:var(--ink-2);margin:10px 0 0}
  #visor{width:100%;height:100%;max-width:none;max-height:none;margin:0;border:0;background:#0B1422;
    overflow:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
  #visor::backdrop{background:#0B1422}
  #visor img{max-width:100%;height:auto;display:block}
  #visor button{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;
    background:rgba(255,255,255,.9);border:0;border-radius:3px;font:inherit;font-size:14px;
    padding:7px 11px;color:var(--ink);cursor:pointer}

  footer{max-width:var(--max);margin:0 auto;padding:22px 18px 40px;
    font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--line)}
  @media (prefers-reduced-motion:no-preference){.dia.hoy{transition:none}}
</style>
</head>

(function(){
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const DOW = ["dom","lun","mar","mié","jue","vie","sáb"];
  const MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

  // Fechas como texto plano, sin zonas horarias que corran un día.
  const d = f => { const [a,m,x] = f.split("-").map(Number); return new Date(a, m-1, x); };
  const corto = f => { const t = d(f); return t.getDate() + " " + MES[t.getMonth()]; };
  const hoyISO = () => { const t = new Date();
    return t.getFullYear() + "-" + String(t.getMonth()+1).padStart(2,"0") + "-" + String(t.getDate()).padStart(2,"0"); };
  const dias = (a,b) => Math.round((d(b) - d(a)) / 86400000);

  const HOY = hoyISO();
  const INICIO = VIAJE.dias[0].fecha;
  const FIN = VIAJE.dias[VIAJE.dias.length-1].fecha;

  /* ---------- Portada ---------- */
  $("#t-titulo").textContent = VIAJE.titulo;

  $("#ruta").innerHTML = VIAJE.ruta.map(p => `
    <div class="parada${p.base ? " base" : ""}">
      <span class="punto"></span>
      <span class="nom">${esc(p.lugar)}</span>
      <span class="noches">${p.noches ? p.noches + (p.noches === 1 ? " noche" : " noches") : "&nbsp;"}</span>
    </div>`).join("");

  /* ---------- Choques de hotel ---------- */
  // Dos reservas chocan si sus estadías se solapan.
  const choques = new Set();
  VIAJE.hoteles.forEach((a,i) => VIAJE.hoteles.forEach((b,j) => {
    if (i < j && d(a.entra) < d(b.sale) && d(b.entra) < d(a.sale)) { choques.add(i); choques.add(j); }
  }));

  /* ---------- Pendientes guardados en el navegador ---------- */
  let hechos = {};
  try { hechos = JSON.parse(localStorage.getItem("japon-pendientes") || "{}"); } catch(e) { hechos = {}; }
  const guardar = () => { try { localStorage.setItem("japon-pendientes", JSON.stringify(hechos)); } catch(e){} };

  /* ---------- Documentos de cada tarjeta ---------- */
  // Cada hotel, tramo y restaurante tiene una "ficha" con sus enlaces de Drive
  // y las capturas guardadas en este celular. La clave une ambas cosas.
  const FICHAS = {};
  const enlacesDrive = (x, texto) => [
    ...(x.doc ? [{ nombre:texto, url:x.doc }] : []),
    ...(x.docs || []).filter(e => e.url)
  ];
  const ficha = f => (FICHAS[f.clave] = f);
  const fichaHotel = x => ficha({ clave:"hotel|" + x.nombre + "|" + x.entra, titulo:x.nombre,
    sub:x.ciudad + " · " + corto(x.entra) + " al " + corto(x.sale), drive:enlacesDrive(x, "Reserva en Drive") });
  const fichaTramo = x => ficha({ clave:"tramo|" + x.fecha + "|" + x.tramo, titulo:x.tramo,
    sub:corto(x.fecha), drive:enlacesDrive(x, "Pasaje en Drive") });
  const fichaComida = x => ficha({ clave:"comida|" + x.nombre + "|" + x.fecha, titulo:x.nombre,
    sub:(x.ciudad ? x.ciudad + " · " : "") + corto(x.fecha) + (x.hora ? " · " + x.hora : ""), drive:enlacesDrive(x, "Reserva en Drive") });
  const attrFicha = f => `data-clave="${esc(f.clave)}" role="button" tabindex="0"`;
  const pistaDocs = f => `<p class="docs-hint" data-cuenta="${esc(f.clave)}">Documentos ›</p>`;

  // Capturas: se guardan en el navegador de este celular (IndexedDB).
  // No se suben a ningún lado, así que funcionan sin señal.
  const Capturas = (() => {
    let db;
    const conectar = () => db || (db = new Promise((ok, mal) => {
      const r = indexedDB.open("japon-documentos", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("capturas", { keyPath:"id", autoIncrement:true })
        .createIndex("clave", "clave");
      r.onsuccess = () => ok(r.result);
      r.onerror = () => mal(r.error);
    }));
    const tx = (modo, fn) => conectar().then(base => new Promise((ok, mal) => {
      const t = base.transaction("capturas", modo);
      const req = fn(t.objectStore("capturas"));
      t.oncomplete = () => ok(req.result);
      t.onerror = t.onabort = () => mal(t.error);
    }));
    return {
      lista: clave => tx("readonly", s => s.index("clave").getAll(clave)),
      todas: () => tx("readonly", s => s.getAll()),
      agregar: (clave, archivo) => tx("readwrite", s => s.add({ clave, blob:archivo, nombre:archivo.name, fecha:Date.now() })),
      borrar: id => tx("readwrite", s => s.delete(id))
    };
  })();

  // Actualiza el "Documentos ›" de cada tarjeta con cuántos hay.
  function contarDocs(){
    const pistas = document.querySelectorAll("[data-cuenta]");
    if (!pistas.length) return;
    Capturas.todas().catch(() => []).then(todas => pistas.forEach(p => {
      const f = FICHAS[p.dataset.cuenta];
      const n = f.drive.length + todas.filter(c => c.clave === f.clave).length;
      p.textContent = n ? `Documentos (${n}) ›` : "Agregar documentos ›";
    }));
  }

  const hoja = document.getElementById("hoja");
  const visor = document.getElementById("visor");
  let urls = [];
  const soltarUrls = () => { urls.forEach(u => URL.revokeObjectURL(u)); urls = []; };

  async function abrirFicha(clave){
    const f = FICHAS[clave];
    if (!f) return;
    let capturas = [], sinGuardar = false;
    try { capturas = await Capturas.lista(clave); } catch(e) { sinGuardar = true; }
    soltarUrls();

    const drive = f.drive.length
      ? `<div class="links">` + f.drive.map(e =>
          `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.nombre)}</a>`).join("") + `</div>`
      : `<p class="meta">Sin enlace todavía. Se agrega en el campo <code>doc</code> del archivo.</p>`;

    const fotos = sinGuardar
      ? `<p class="meta">Este navegador no deja guardar capturas (¿modo privado?).</p>`
      : (capturas.length ? `<div class="capturas">` + capturas.map(c => {
          const u = URL.createObjectURL(c.blob); urls.push(u);
          return `<div class="captura">
            <button type="button" class="ver" data-ver="${u}" aria-label="Ver ${esc(c.nombre || "captura")}"><img src="${u}" alt=""></button>
            <button type="button" class="borrar" data-borrar="${c.id}">Borrar</button></div>`;
        }).join("") + `</div>` : `<p class="meta">Todavía no hay capturas en este celular.</p>`) +
        `<label class="agregar">Agregar captura<input type="file" accept="image/*" multiple data-agregar="${esc(clave)}"></label>
         <p class="nota">Las capturas quedan guardadas solo en este celular y se ven sin señal. No se suben a internet ni al repositorio, así que cada uno tiene que agregar las suyas.</p>`;

    hoja.innerHTML = `<button type="button" class="cerrar" data-cerrar>Cerrar</button>
      <h3>${esc(f.titulo)}</h3><p class="meta">${esc(f.sub)}</p>
      <h4>Capturas</h4>${fotos}
      <h4>En Drive</h4>${drive}`;
    hoja.dataset.clave = clave;
    if (!hoja.open) hoja.showModal();
  }

  hoja.addEventListener("click", async e => {
    if (e.target === hoja || e.target.closest("[data-cerrar]")) return hoja.close();
    const ver = e.target.closest("[data-ver]");
    if (ver) { visor.querySelector("img").src = ver.dataset.ver; visor.showModal(); return; }
    const borrar = e.target.closest("[data-borrar]");
    if (borrar && confirm("¿Borrar esta captura de este celular?")) {
      await Capturas.borrar(Number(borrar.dataset.borrar));
      abrirFicha(hoja.dataset.clave); contarDocs();
    }
  });
  hoja.addEventListener("change", async e => {
    const input = e.target.closest("[data-agregar]");
    if (!input || !input.files.length) return;
    try {
      for (const archivo of input.files) await Capturas.agregar(input.dataset.agregar, archivo);
      // Pide que el navegador no borre lo guardado cuando falta espacio.
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    } catch(err) { alert("No se pudo guardar la captura en este celular."); }
    abrirFicha(input.dataset.agregar); contarDocs();
  });
  hoja.addEventListener("close", soltarUrls);
  document.getElementById("visor-cerrar").addEventListener("click", () => visor.close());

  document.addEventListener("click", e => {
    const card = e.target.closest(".card[data-clave]");
    if (card && !e.target.closest("a")) abrirFicha(card.dataset.clave);
  });
  document.addEventListener("keydown", e => {
    const card = e.target.closest && e.target.closest(".card[data-clave]");
    if (card && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); abrirFicha(card.dataset.clave); }
  });

  /* ---------- Panel: Hoy ---------- */
  function panelHoy(){
    let h = "";
    const faltan = dias(HOY, INICIO);
    const enViaje = HOY >= INICIO && HOY <= FIN;

    if (enViaje) {
      const hoy = VIAJE.dias.find(x => x.fecha === HOY);
      h += `<h2 class="titulo">Hoy</h2><p class="sub">Día ${dias(INICIO,HOY)+1} de ${VIAJE.dias.length}</p>`;
      if (hoy) h += tarjetaDia(hoy, true);
      const sig = VIAJE.dias.find(x => x.fecha > HOY);
      if (sig) h += `<h2 class="titulo" style="margin-top:26px;margin-bottom:10px">Mañana</h2>` + tarjetaDia(sig, false);
      const tr = VIAJE.transporte.filter(t => t.fecha >= HOY).slice(0,1);
      if (tr.length) h += `<h2 class="titulo" style="margin-top:26px">Próximo tramo</h2><p class="sub">${esc(corto(tr[0].fecha))}</p>` + tarjetaTramo(tr[0]);
    } else if (faltan > 0) {
      h += `<h2 class="titulo">Faltan ${faltan} días</h2><p class="sub">Salida el ${corto(INICIO)} de 2026</p>`;
    } else {
      h += `<h2 class="titulo">El viaje terminó</h2><p class="sub">${esc(VIAJE.fechas)}</p>`;
    }

    if (choques.size) {
      const lista = [...choques].map(i => VIAJE.hoteles[i]);
      const ciudades = [...new Set(lista.map(x => x.ciudad))].join(" y ");
      h += `<div class="aviso"><h3>Reservas de hotel superpuestas</h3>
        <p>Hay ${lista.length} reservas que se pisan en ${esc(ciudades)}. Revisa la sección Hoteles.</p></div>`;
    }

    const dec = VIAJE.decisiones || {};
    const respuesta = p => p.resuelvePor ? (dec[p.resuelvePor] || "") : "";
    const cerrado = p => p.resuelvePor ? !!respuesta(p) : !!hechos[p.id];
    const abiertos = VIAJE.pendientes.filter(p => !cerrado(p));

    h += `<h2 class="titulo" style="margin-top:28px">Pendientes</h2>
          <p class="sub">${abiertos.length} sin resolver de ${VIAJE.pendientes.length}</p>
          <div id="lista-pendientes">` +
      VIAJE.pendientes.map(p => {
        const r = respuesta(p);
        // Los pendientes con respuesta no se marcan a mano: se resuelven
        // escribiendo la decisión en el archivo, para que ambos la vean.
        const caja = p.resuelvePor
          ? `<input type="checkbox" checked disabled>`
          : `<input type="checkbox" id="chk-${esc(p.id)}" data-id="${esc(p.id)}" ${hechos[p.id] ? "checked" : ""}>`;
        const etiqueta = p.resuelvePor
          ? `<label>${esc(p.texto)}<span class="cuando">${r ? "Respuesta: " + esc(r) : esc(p.cuando)}</span></label>`
          : `<label for="chk-${esc(p.id)}">${esc(p.texto)}<span class="cuando">${esc(p.cuando)}</span></label>`;
        return `<div class="check${cerrado(p) ? " listo" : ""}">
          ${p.resuelvePor && !r ? `<input type="checkbox" disabled>` : caja}${etiqueta}
        </div>`;
      }).join("") + `</div>`;

    return h;
  }

  function tarjetaDia(x, destacado){
    return `<div class="card${destacado ? " choque" : ""}" style="${destacado ? "border-left-color:var(--shu)" : ""}">
      <h3>${esc(x.plan)}</h3>
      <p class="meta">${esc(corto(x.fecha))} · duermen en ${esc(x.duerme)}</p>
      <p class="meta">${esc(x.como)}</p></div>`;
  }

  /* ---------- Panel: Itinerario ---------- */
  function panelItinerario(){
    return `<h2 class="titulo">Itinerario</h2>
      <p class="sub">${esc(VIAJE.fechas)}</p>` +
      VIAJE.dias.map(x => {
        const t = d(x.fecha);
        return `<div class="dia${x.fecha === HOY ? " hoy" : ""}">
          <div class="fecha"><span class="num">${t.getDate()}</span><span class="dow">${DOW[t.getDay()]}</span></div>
          <div>
            <div class="plan">${esc(x.plan)}</div>
            <div class="donde">Duermen en ${esc(x.duerme)}</div>
            <div class="como">${esc(x.como)}</div>
          </div></div>`;
      }).join("");
  }

  /* ---------- Panel: Hoteles ---------- */
  function panelHoteles(){
    let h = `<h2 class="titulo">Hoteles</h2><p class="sub">${VIAJE.hoteles.length} reservas</p>`;
    if (choques.size) {
      h += `<div class="aviso"><h3>Revisar antes de seguir</h3>
        <p>Las reservas marcadas en rojo ocupan las mismas noches. Conviene cancelar una de cada par mientras la cancelación siga siendo gratis.</p></div>`;
    }
    h += VIAJE.hoteles.map((x,i) => `
      <div class="card abre${choques.has(i) ? " choque" : ""}" ${attrFicha(fichaHotel(x))}>
        <div class="fila">
          <h3>${esc(x.nombre)}</h3>
          <span class="precio">${esc(x.precio)}</span>
        </div>
        <p class="meta">${esc(x.ciudad)} · ${esc(corto(x.entra))} al ${esc(corto(x.sale))} · ${dias(x.entra,x.sale)} ${dias(x.entra,x.sale) === 1 ? "noche" : "noches"}</p>
        <span class="tag ${choques.has(i) ? "alerta" : "ok"}">${choques.has(i) ? "Se superpone con otra reserva" : esc(x.estado)}</span>
        ${pistaDocs(fichaHotel(x))}
      </div>`).join("");
    return h;
  }

  /* ---------- Panel: Transporte ---------- */
  // Si el tramo depende de una decisión, muestra la variante elegida.
  // Mientras no esté decidida, muestra todas las opciones.
  function variantes(x){
    if (!x.segun || !x.opciones) return "";
    const elegida = (VIAJE.decisiones || {})[x.segun];
    if (elegida && x.opciones[elegida]) {
      return `<p class="meta" style="margin-top:6px"><strong>${esc(elegida)}:</strong> ${esc(x.opciones[elegida])}</p>`;
    }
    return `<p class="meta" style="margin-top:6px;color:var(--shu)">Falta decidir. Las dos opciones:</p>` +
      Object.keys(x.opciones).map(k =>
        `<p class="meta" style="margin-top:4px"><strong>${esc(k)}:</strong> ${esc(x.opciones[k])}</p>`).join("");
  }

  // Un tramo está comprado si tiene el pasaje en "doc" o si "reserva" dice "Comprado".
  const comprado = x => !!x.doc || /^comprad/i.test(x.reserva);

  // Enlaces del tramo: el fijo, o el de la opción elegida. Sin decidir, todos.
  function enlacesTramo(x){
    const lista = x.enlace ? [{ url:x.enlace, texto:x.enlaceTexto || x.enlace }] : [];
    if (x.enlaces) {
      const elegida = (VIAJE.decisiones || {})[x.segun];
      if (elegida && x.enlaces[elegida]) lista.push(x.enlaces[elegida]);
      else if (!elegida) lista.push(...Object.values(x.enlaces));
    }
    return lista.map(e =>
      `<p class="meta" style="margin-top:7px"><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.texto)}</a></p>`).join("");
  }

  function tarjetaTramo(x){
    const listo = comprado(x);
    const etiqueta = listo ? (/^comprad/i.test(x.reserva) ? x.reserva : "Comprado") : x.reserva;
    return `<div class="card abre" ${attrFicha(fichaTramo(x))}>
      <div class="fila"><h3>${esc(x.tramo)}</h3><span class="precio">${esc(corto(x.fecha))}</span></div>
      <p class="meta" style="margin-top:6px">${esc(x.detalle)}</p>
      ${variantes(x)}
      <span class="tag ${!listo && /SmartEX|Reservar/.test(x.reserva) ? "alerta" : "ok"}">${esc(etiqueta)}</span>
      ${x.prioridad && !listo ? `<p class="meta" style="margin-top:7px">${esc(x.prioridad)}</p>` : ""}
      ${enlacesTramo(x)}
      ${pistaDocs(fichaTramo(x))}
    </div>`;
  }
  function panelTransporte(){
    return `<h2 class="titulo">Transporte</h2>
      <p class="sub">Reservar solo los dos Shinkansen largos y la bicicleta. Trenes locales y ferries se compran en el momento.</p>` +
      VIAJE.transporte.map(tarjetaTramo).join("");
  }

  /* ---------- Panel: Comidas ---------- */
  function panelComidas(){
    let h = `<h2 class="titulo">Restaurantes</h2><p class="sub">Reservas y lugares por probar</p>`;
    if (!VIAJE.comidas.length) {
      h += `<div class="vacio">Todavía no hay restaurantes cargados.<br>
        Se agregan en el bloque <code>comidas</code> del archivo.</div>`;
      return h;
    }
    h += VIAJE.comidas.map(x => `
      <div class="card abre" ${attrFicha(fichaComida(x))}>
        <div class="fila"><h3>${esc(x.nombre)}</h3><span class="precio">${esc(corto(x.fecha))}</span></div>
        <p class="meta">${esc(x.ciudad || "")}${x.hora ? " · " + esc(x.hora) : ""}</p>
        ${x.nota ? `<p class="meta">${esc(x.nota)}</p>` : ""}
        ${pistaDocs(fichaComida(x))}
      </div>`).join("");
    return h;
  }

  /* ---------- Panel: Documentos ---------- */
  function panelDocumentos(){
    const listos = VIAJE.documentos.filter(x => x.url);
    let h = `<h2 class="titulo">Documentos</h2>
      <p class="sub">Los archivos viven en Drive. Acá solo están los enlaces, así que piden tu cuenta para abrirse.</p>`;
    if (!listos.length) {
      h += `<div class="vacio">Faltan los enlaces de Drive.<br>
        Se pegan en el bloque <code>documentos</code> del archivo.</div>`;
    } else {
      h += `<div class="links">` + listos.map(x =>
        `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.nombre)}</a>`).join("") + `</div>`;
    }
    h += `<div class="aviso info" style="margin-top:20px"><h3>Antes de viajar</h3>
      <p>Marcar en la app de Drive los documentos como disponibles sin conexión. En el metro de Tokio no siempre hay señal.</p></div>`;
    return h;
  }

  /* ---------- Navegación ---------- */
  const PANELES = [
    { id:"hoy",         nombre:"Hoy",         render:panelHoy },
    { id:"itinerario",  nombre:"Itinerario",  render:panelItinerario },
    { id:"hoteles",     nombre:"Hoteles",     render:panelHoteles },
    { id:"transporte",  nombre:"Transporte",  render:panelTransporte },
    { id:"comidas",     nombre:"Restaurantes",render:panelComidas },
    { id:"documentos",  nombre:"Documentos",  render:panelDocumentos }
  ];

  $("#tabs").innerHTML = PANELES.map((p,i) =>
    `<button role="tab" data-p="${p.id}" aria-selected="${i===0}">${p.nombre}</button>`).join("");

  function abrir(id){
    PANELES.forEach(p => {
      const el = document.getElementById("p-" + p.id);
      const activo = p.id === id;
      el.hidden = !activo;
      if (activo) el.innerHTML = p.render();
    });
    contarDocs();
    document.querySelectorAll("#tabs button").forEach(b =>
      b.setAttribute("aria-selected", b.dataset.p === id));
    window.scrollTo({ top:0 });
  }

  $("#tabs").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (b) abrir(b.dataset.p);
  });

  // Marcar pendientes
  document.addEventListener("change", e => {
    if (e.target.matches('input[type="checkbox"][data-id]')) {
      hechos[e.target.dataset.id] = e.target.checked;
      guardar();
      abrir("hoy");
    }
  });

  $("#pie").textContent = VIAJE.notas;
  abrir("hoy");
})();
</script>
</body>
</html>
